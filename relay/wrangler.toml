# Deployed with `npx wrangler deploy` (auth via CLOUDFLARE_API_TOKEN env var).
name = "remote-control-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Control page is served from this same origin; unmatched paths fall through
# to the Worker, which handles /ws.
[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object instance per session id — it holds the live sockets and
# forwards frames between the phone and every connected browser.
# A second well-known instance tracks every connected device globally so the
# control console can list and unlock them.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionDO"

# Global device registry — lists every connected device and holds unlock state.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[migrations]]
tag = "v1"
# SQLite-backed class: required for Durable Objects on the free plan.
new_sqlite_classes = ["SessionDO"]

[[migrations]]
tag = "v2"
# Global device registry (list + unlock 00100) across all sessions.
new_sqlite_classes = ["RegistryDO"]
