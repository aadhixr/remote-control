name: Build debug APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-latest runner image ships ANDROID_HOME with cmdline-tools,
      # android-35 and build-tools 35.0.0 already installed (see the
      # actions/runner-images Ubuntu readme). Only install if missing.
      - name: Ensure Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" --licenses > /dev/null || true
            "$SM" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Copy APK into download app/
        run: |
          mkdir -p "download app"
          cp app/build/outputs/apk/debug/app-debug.apk "download app/remote-control-v1.0-debug.apk"
          ls -lh "download app"

      - name: Commit the APK back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "download app"
          if git diff --cached --quiet; then
            echo "APK already up to date."
          else
            git commit -m "CI: Remote Control debug APK -> download app/ [skip ci]"
            git push
          fi
